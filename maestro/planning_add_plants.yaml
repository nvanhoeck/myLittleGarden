appId: com.mylittlegarden.app
name: Planning - Add plants to the "Te plannen" list
---
# Fresh install, garden box, "+" -> plant with quantity 3 -> back on detail
# with "Te plannen (3)". Nothing is placed on the canvas yet.
- runFlow: subflows/setup_environment.yaml
- runFlow: subflows/create_garden_box.yaml

- assertVisible:
    text: "Te plannen \\(0\\)"
- assertVisible:
    id: "planning-rearrange"
- assertVisible:
    id: "planning-start-over"

- runFlow: subflows/add_plants_to_plan.yaml

- extendedWaitUntil:
    visible:
      text: "Te plannen \\(3\\)"
    timeout: 5000

# One grouped row: Tomaat x3, not yet planned
- tapOn:
    id: "planning-to-plan-header"
- extendedWaitUntil:
    visible:
      id: "planning-to-plan-row-tomaat"
    timeout: 3000
- assertVisible:
    text: "Tomaat ×3"
- assertVisible:
    text: "Nog niet ingepland"
- assertNotVisible:
    id: "planning-footprint-.*"
