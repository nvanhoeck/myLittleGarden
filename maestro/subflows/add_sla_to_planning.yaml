appId: com.mylittlegarden.app
---
# Shared: on the Planning screen, add only Sla and come back.
- tapOn:
    id: "planning-add-plant-button"
- extendedWaitUntil:
    visible:
      id: "plant-selection-screen"
    timeout: 5000
- tapOn:
    id: "plant-search-input"
- inputText: "Sla"
- hideKeyboard
- tapOn:
    id: "plant-tile-sla"
- assertVisible:
    text: "1 plant toevoegen"
- tapOn:
    id: "add-plants-button"
- extendedWaitUntil:
    visible:
      id: "planning-plant-sla"
    timeout: 5000
