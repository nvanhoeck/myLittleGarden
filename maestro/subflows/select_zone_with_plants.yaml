appId: com.mylittlegarden.app
---
# Shared: scrolls the week strip until a zone with plants is on screen and taps it.
# The strip opens on the current week, so the planting zone is usually to the
# left (earlier weeks): swiping RIGHT on the strip reveals earlier weeks.
# Falls back to swiping LEFT (later weeks) if it was not found.
- repeat:
    while:
      notVisible:
        text: "Zone week \\d+ tot \\d+, [1-9]\\d* planten?.*"
    times: 15
    commands:
      - swipe:
          from:
            id: "planning-week-.*"
          direction: RIGHT
          duration: 300
- repeat:
    while:
      notVisible:
        text: "Zone week \\d+ tot \\d+, [1-9]\\d* planten?.*"
    times: 30
    commands:
      - swipe:
          from:
            id: "planning-week-.*"
          direction: LEFT
          duration: 300
- tapOn:
    text: "Zone week \\d+ tot \\d+, [1-9]\\d* planten?.*"
