appId: com.mylittlegarden.app
---
# Shared: fresh install -> frost dates (picker defaults) -> home screen.
# The season flows never hardcode a season; they pick season tabs through their
# accessibility labels, so the frost dates matter only for season_carry_over.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "environment-setup-screen"
    timeout: 10000
- tapOn:
    id: "spring-frost-input-button"
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 3000
- tapOn:
    text: "OK"
- waitForAnimationToEnd
- tapOn:
    id: "fall-frost-input-button"
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 3000
- tapOn:
    text: "OK"
- waitForAnimationToEnd
- tapOn:
    id: "complete-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 8000
