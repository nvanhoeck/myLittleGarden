appId: com.mylittlegarden.app
name: Planning - Browse weeks, zones and years
---
# No week number is hardcoded (the default selection is the real current
# week). Weeks and zones are found through their accessibility labels:
#   "Week 18, 27 april tot 3 mei, 3 planten"  /  "Zone week 18 tot 24, 3 planten"
- runFlow: subflows/prepare_planning_component.yaml
- tapOn:
    id: "planning-rearrange"
- extendedWaitUntil:
    visible:
      id: "planning-snackbar"
    timeout: 10000

- assertVisible:
    id: "planning-year-label"
- copyTextFrom:
    id: "planning-year-label"
- evalScript: ${output.planningYear = maestro.copiedText}

# ── Zone: caption becomes "Wx - Wy · n planten", footprints appear ────
- runFlow: subflows/select_zone_with_plants.yaml
- assertVisible:
    text: "W\\d+ - W\\d+ · [1-9]\\d* planten?"
- assertVisible:
    id: "planning-footprint-.*"

# ── Single week with plants: caption switches to the week range ────────
# (the zone is still on screen, so a week with plants is too)
- tapOn:
    text: "Week \\d+, .*, [1-9]\\d* planten?.*"
- assertNotVisible:
    text: "W\\d+ - W\\d+ · .*"
- assertVisible:
    text: "W\\d+ · .*"
- assertVisible:
    id: "planning-footprint-.*"

# ── Week without plants: footprints disappear ─────────────────────────
- repeat:
    while:
      notVisible:
        text: "Week \\d+, .*, 0 planten.*"
    times: 30
    commands:
      - swipe:
          from:
            id: "planning-week-.*"
          direction: LEFT
          duration: 300
- tapOn:
    text: "Week \\d+, .*, 0 planten.*"
- assertNotVisible:
    id: "planning-footprint-.*"

# ── Next year: label changes, nothing is planned there ────────────────
- tapOn:
    id: "planning-year-next"
- assertNotVisible:
    id: "planning-year-label"
    text: ${output.planningYear}
- assertNotVisible:
    id: "planning-footprint-.*"
- assertVisible:
    text: "W1 · .*"

# ── Previous year: back in the planned year, footprints return ────────
- tapOn:
    id: "planning-year-prev"
- assertVisible:
    id: "planning-year-label"
    text: ${output.planningYear}
- runFlow: subflows/select_zone_with_plants.yaml
- assertVisible:
    id: "planning-footprint-.*"
