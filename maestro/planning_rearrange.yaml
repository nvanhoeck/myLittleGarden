appId: com.mylittlegarden.app
name: Planning - Rearrange places plants in their period
---
- runFlow: subflows/prepare_planning_component.yaml

- tapOn:
    id: "planning-rearrange"

# A result snackbar shows one of the outcomes
- extendedWaitUntil:
    visible:
      id: "planning-snackbar"
    timeout: 10000
- assertVisible:
    text: "Alles geplaatst \\(\\d+\\)|\\d+ geplaatst, \\d+ (past|passen) niet|Niets kon worden geplaatst"

# The "Te plannen" count decreased: at most 2 of the 3 plants still wait
- assertVisible:
    text: "Te plannen \\([0-2]\\)"

# Footprints are only drawn for the selected week/zone: jump to a zone with plants
- runFlow: subflows/select_zone_with_plants.yaml
- assertVisible:
    text: "W\\d+ - W\\d+ · [1-9]\\d* planten?"
- assertVisible:
    id: "planning-footprint-.*"
